name: CI
on: [push, pull_request]
jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/checkout@v7
      - run: python -m pip install pre-commit
      - run: pre-commit run --show-diff-on-failure --all-files

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7.0.0
      - uses: actions/checkout@v7
      - run: python -m pip install -r docs/requirements.txt
      - run: cd docs/ && make html && make spelling

  tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: [3.11, 3.12, 3.13, 3.14]
        django-version: [5.2, 6.0, 6.1, "main"]
        postgres-version: ["postgres:14", "postgres:15", "postgres:16", "postgres:17", "postgres:18"]
        exclude:
            # Django 6.0
            - django-version: 6.0
              python-version: 3.11

            # Django 6.1
            - django-version: 6.1
              python-version: 3.11
            - django-version: 6.1
              postgres-version: "postgres:14"

            # Django main
            - django-version: main
              python-version: 3.11
            - django-version: main
              postgres-version: "postgres:14"
            - django-version: main
              postgres-version: "postgres:15"

    services:
      postgres:
        image: ${{ matrix.postgres-version }}
        env:
          POSTGRES_USER: modeltrans
          POSTGRES_PASSWORD: modeltrans
          POSTGRES_DB: modeltrans
        ports:
          - 5432:5432
    steps:
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/checkout@v7
      - run: python -m pip install Django==${{ matrix.django-version }}
        if: matrix.django-version != 'main'
      - run: python -m pip install https://github.com/django/django/archive/main.tar.gz
        if: matrix.django-version == 'main'
      - run: |
          python -m pip install coverage
          python -m pip install psycopg==3.1.12
      - run: coverage run --source=modeltrans manage.py test
