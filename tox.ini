
[tox]
args_are_paths = false
envlist =
    py310-5.2,
    py311-5.2,
    py312-{5.2,6.0,6.1,main},
    py313-{5.2,6.0,6.1,main},
    py314-{5.2,6.0,6.1,main},
    migrate,
    docs

[testenv]
basepython =
    py310: python3.10
    py311: python3.11
    py312: python3.12
    py313: python3.13
    py314: python3.14
usedevelop = true
pip_pre = true
setenv =
    DJANGO_SETTINGS_MODULE=tests.app.settings
    PYTHONPATH={toxinidir}
    PYTHONWARNINGS=all
commands =
    coverage run ./manage.py test --no-input
deps =
    5.2: Django==5.2.*
    6.0: Django==6.0.*
    6.1: Django==6.1b1
    main: https://github.com/django/django/archive/main.tar.gz
    psycopg
    coverage

[testenv:migrate]
setenv =
    PYTHONPATH={toxinidir}
    PYTHONDONTWRITEBYTECODE=1
    COVERAGE_FILE=../.coverage
basepython = python3.11
recreate = true
skip_install = true
deps = coverage
commands =
    python test_migrations/test.py
    python test_migrations/clean.py

[testenv:docs]
basepython = python3.11
allowlist_externals = make
changedir = docs
setenv = PYTHONWARNINGS=once
commands =
    make html
    make spelling
skip_install = True
deps =
    -r{toxinidir}/docs/requirements.txt
